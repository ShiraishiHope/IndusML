<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BonneEcoute - Analyse de Test Tonal et Vocal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); }
        .history-item { cursor: pointer; transition: all 0.2s; border-left: 4px solid transparent; }
        .history-item:hover { border-left-color: #3b82f6; background-color: #f1f5f9; transform: translateX(2px); }
        #history-list::-webkit-scrollbar { width: 4px; }
        #history-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center px-8">
        <div class="flex items-center gap-3">
            <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path>
            </svg>
            <h1 class="text-xl font-black tracking-tighter uppercase">BONNE<span class="text-blue-400">ECOUTE</span></h1>
        </div>
        <div id="api-status-badge" class="text-[10px] font-bold px-3 py-1 rounded-full bg-slate-800 border border-slate-700 uppercase tracking-widest text-yellow-500">
            API: Vérification...
        </div>
    </header>

    <main class="flex-grow grid lg:grid-cols-12 gap-6 p-6 max-w-7xl mx-auto w-full">
        
        <div class="lg:col-span-5 flex flex-col gap-6">
            
            <div class="flex space-x-2 bg-slate-200/50 p-1.5 rounded-2xl">
                <button id="tab-tonal" class="flex-1 py-3 px-4 rounded-xl text-sm font-bold bg-white text-blue-600 shadow-sm transition-all">
                    Audiométrie Tonale
                </button>
                <button id="tab-vocal" class="flex-1 py-3 px-4 rounded-xl text-sm font-bold text-slate-500 hover:text-purple-600 transition-all">
                    Audiométrie Vocale
                </button>
            </div>

            <div id="panel-tonal" class="space-y-6">
                <section class="glass rounded-3xl shadow-sm border border-slate-200 p-8">
                    <h2 class="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2">
                        <span class="p-2 bg-blue-100 text-blue-600 rounded-lg text-xs">T</span>
                        Mesures Audiométriques (Tonal)
                    </h2>

                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase">Prénom</label>
                                <input type="text" id="prenom" placeholder="Jean" class="w-full mt-1 px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase">Nom</label>
                                <input type="text" id="nom" placeholder="Dupont" class="w-full mt-1 px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                            </div>
                        </div>

                        <div class="grid grid-cols-4 gap-3">
                            <div><label class="text-[9px] font-bold text-slate-400 uppercase">125 Hz</label><input type="number" id="f125" class="w-full p-2 border rounded-lg text-center font-bold focus:border-blue-500 outline-none"></div>
                            <div><label class="text-[9px] font-bold text-slate-400 uppercase">250 Hz</label><input type="number" id="f250" class="w-full p-2 border rounded-lg text-center font-bold focus:border-blue-500 outline-none"></div>
                            <div><label class="text-[9px] font-bold text-slate-400 uppercase">500 Hz</label><input type="number" id="f500" class="w-full p-2 border rounded-lg text-center font-bold focus:border-blue-500 outline-none"></div>
                            <div><label class="text-[9px] font-bold text-slate-400 uppercase">1k Hz</label><input type="number" id="f1k" class="w-full p-2 border rounded-lg text-center font-bold focus:border-blue-500 outline-none"></div>
                            <div><label class="text-[9px] font-bold text-slate-400 uppercase">2k Hz</label><input type="number" id="f2k" class="w-full p-2 border rounded-lg text-center font-bold focus:border-blue-500 outline-none"></div>
                            <div><label class="text-[9px] font-bold text-slate-400 uppercase">4k Hz</label><input type="number" id="f4k" class="w-full p-2 border rounded-lg text-center font-bold focus:border-blue-500 outline-none"></div>
                            <div><label class="text-[9px] font-bold text-slate-400 uppercase">8k Hz</label><input type="number" id="f8k" class="w-full p-2 border rounded-lg text-center font-bold focus:border-blue-500 outline-none"></div>
                        </div>

                        <button id="predict-btn" class="w-full py-4 bg-blue-600 text-white font-bold rounded-2xl shadow-lg hover:bg-blue-700 transition-all active:scale-95">
                            Lancer l'Analyse Tonale
                        </button>
                    </div>
                </section>

                <section class="glass rounded-3xl shadow-sm border border-slate-200 p-6">
                    <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4 flex justify-between items-center">
                        Journal des patients
                        <button onclick="fetchHistory()" class="text-blue-500 text-[10px] hover:underline font-black">ACTUALISER</button>
                    </h3>
                    <div id="history-list" class="space-y-2 max-h-60 overflow-y-auto pr-2"></div>
                </section>
            </div>

            <div id="panel-vocal" class="hidden space-y-6">
                <section class="glass rounded-3xl shadow-sm border border-slate-200 p-8">
                    <h2 class="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2">
                        <span class="p-2 bg-purple-100 text-purple-600 rounded-lg text-xs">V</span>
                        Test d'Audition Vocale
                    </h2>
                
                    <form id="vocal-form" class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase">Oreille</label>
                                <select id="oreille-vocal" class="w-full mt-1 px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-purple-500">
                                    <option value="Droite">Droite</option>
                                    <option value="Gauche">Gauche</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase">Seuil SRT (dB)</label>
                                <input type="number" id="srt_db" placeholder="dB" class="w-full mt-1 px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-purple-500" required>
                            </div>
                        </div>
                
                        <div class="grid grid-cols-3 gap-3">
                            <div><label class="text-[10px] font-bold text-slate-400 uppercase">40 dB (%)</label><input type="number" id="s40" class="w-full mt-1 p-2 border rounded-lg text-center font-bold focus:border-purple-500"></div>
                            <div><label class="text-[10px] font-bold text-slate-400 uppercase">60 dB (%)</label><input type="number" id="s60" class="w-full mt-1 p-2 border rounded-lg text-center font-bold focus:border-purple-500"></div>
                            <div><label class="text-[10px] font-bold text-slate-400 uppercase">80 dB (%)</label><input type="number" id="s80" class="w-full mt-1 p-2 border rounded-lg text-center font-bold focus:border-purple-500"></div>
                        </div>
                
                        <button type="submit" class="w-full py-4 bg-purple-600 text-white font-bold rounded-2xl shadow-lg hover:bg-purple-700 transition-all active:scale-95">
                            Prédire le Gain Vocal
                        </button>
                    </form>
                </section>
            </div>
        </div>

        <div class="lg:col-span-7">
            <div class="glass rounded-3xl shadow-sm border border-slate-200 p-8 h-full flex flex-col">
                <h2 id="chart-title" class="text-lg font-bold text-slate-800 mb-6">Simulation Audiométrique</h2>
                
                <div id="chart-placeholder" class="flex-grow flex flex-col items-center justify-center bg-slate-50 border-2 border-dashed border-slate-200 rounded-3xl text-slate-400 p-10 text-center italic">
                    <p>En attente de mesures pour visualiser l'analyse.</p>
                </div>
                
                <div id="chart-container" class="hidden flex-grow relative min-h-[450px] w-full">
                    <canvas id="mainChart"></canvas>
                </div>

                <div id="result-badge" class="hidden mt-6 p-4 rounded-2xl border text-center font-bold"></div>

                <div class="mt-6 flex justify-between items-center bg-slate-100 p-4 rounded-2xl border border-slate-200">
                    <div class="flex flex-col">
                        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-tight">Moteur Kedro</span>
                        <span class="text-xs font-black text-slate-700">CNN Model v1.0</span>
                    </div>
                    <button id="train-btn" class="text-[10px] font-black uppercase bg-slate-800 text-white px-5 py-2.5 rounded-xl hover:bg-black transition-all shadow-md">Ré-entraîner</button>
                </div>
            </div>
        </div>

    </main>

    <script>
        const API = "http://127.0.0.1:5000";
        let mainChart = null;

        // --- NAVIGATION ---
        const tabTonal = document.getElementById('tab-tonal');
        const tabVocal = document.getElementById('tab-vocal');
        const panelTonal = document.getElementById('panel-tonal');
        const panelVocal = document.getElementById('panel-vocal');
        const chartTitle = document.getElementById('chart-title');

        tabTonal.addEventListener('click', () => {
            tabTonal.className = "flex-1 py-3 px-4 rounded-xl text-sm font-bold bg-white text-blue-600 shadow-sm transition-all";
            tabVocal.className = "flex-1 py-3 px-4 rounded-xl text-sm font-bold text-slate-500 transition-all";
            panelTonal.classList.remove('hidden');
            panelVocal.classList.add('hidden');
            chartTitle.innerText = "Audiogramme Tonal";
            resetVisuals();
        });

        tabVocal.addEventListener('click', () => {
            tabVocal.className = "flex-1 py-3 px-4 rounded-xl text-sm font-bold bg-white text-purple-600 shadow-sm transition-all";
            tabTonal.className = "flex-1 py-3 px-4 rounded-xl text-sm font-bold text-slate-500 transition-all";
            panelVocal.classList.remove('hidden');
            panelTonal.classList.add('hidden');
            chartTitle.innerText = "Courbe d'Intelligibilité Vocale";
            resetVisuals();
        });

        function resetVisuals() {
            document.getElementById('chart-container').classList.add('hidden');
            document.getElementById('chart-placeholder').classList.remove('hidden');
            document.getElementById('result-badge').classList.add('hidden');
        }

        // --- STATUT API & HISTORIQUE ---
        async function checkStatus() {
            try {
                const res = await fetch(API + "/");
                if(res.ok) {
                    const badge = document.getElementById('api-status-badge');
                    badge.innerText = "API: Connecté";
                    badge.classList.replace('text-yellow-500', 'text-emerald-500');
                    fetchHistory();
                }
            } catch(e) {}
        }

        async function fetchHistory() {
            const list = document.getElementById('history-list');
            try {
                const res = await fetch(API + "/history");
                const data = await res.json();
                list.innerHTML = "";
                if(!data.length) {
                    list.innerHTML = '<p class="text-[10px] text-slate-400 text-center py-4 italic">Aucun test archivé.</p>';
                    return;
                }
                data.reverse().forEach(entry => {
                    const item = document.createElement('div');
                    item.className = "history-item p-3 bg-white border border-slate-100 rounded-xl flex justify-between items-center shadow-sm mb-2";
                    item.onclick = () => loadHistoryEntry(entry);
                    item.innerHTML = `
                        <div class="flex flex-col">
                            <span class="text-xs font-bold text-slate-700">${entry.prenom || ''} ${entry.nom || 'Anonyme'}</span>
                            <span class="text-[8px] text-slate-400 tracking-wider uppercase">Restaurer</span>
                        </div>
                    `;
                    list.appendChild(item);
                });
            } catch(e) {}
        }

        function loadHistoryEntry(e) {
            document.getElementById('prenom').value = e.prenom || "";
            document.getElementById('nom').value = e.nom || "";
            document.getElementById('f125').value = e.before_exam_125_Hz || 0;
            document.getElementById('f250').value = e.before_exam_250_Hz || 0;
            document.getElementById('f500').value = e.before_exam_500_Hz || 0;
            document.getElementById('f1k').value = e.before_exam_1000_Hz || 0;
            document.getElementById('f2k').value = e.before_exam_2000_Hz || 0;
            document.getElementById('f4k').value = e.before_exam_4000_Hz || 0;
            document.getElementById('f8k').value = e.before_exam_8000_Hz || 0;
            tabTonal.click();
            alert("Patient " + (e.nom || "") + " chargé.");
        }

        // --- ANALYSE TONALE ---
        document.getElementById('predict-btn').onclick = async () => {
            const payload = {
                prenom: document.getElementById('prenom').value,
                nom: document.getElementById('nom').value,
                before_exam_125_Hz: parseFloat(document.getElementById('f125').value) || 0,
                before_exam_250_Hz: parseFloat(document.getElementById('f250').value) || 0,
                before_exam_500_Hz: parseFloat(document.getElementById('f500').value) || 0,
                before_exam_1000_Hz: parseFloat(document.getElementById('f1k').value) || 0,
                before_exam_2000_Hz: parseFloat(document.getElementById('f2k').value) || 0,
                before_exam_4000_Hz: parseFloat(document.getElementById('f4k').value) || 0,
                before_exam_8000_Hz: parseFloat(document.getElementById('f8k').value) || 0
            };

            try {
                const res = await fetch(API + "/predict", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ data: [payload] })
                });
                const data = await res.json();
                renderTonalChart(payload, data[0]);
                fetchHistory();
            } catch(e) { alert("Erreur API Tonal."); }
        };

        function renderTonalChart(before, after) {
            document.getElementById('chart-placeholder').classList.add('hidden');
            document.getElementById('chart-container').classList.remove('hidden');
            if(mainChart) mainChart.destroy();

            const ctx = document.getElementById('mainChart').getContext('2d');
            mainChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['125', '250', '500', '1k', '2k', '4k', '8k'],
                    datasets: [
                        { label: 'Sans Appareil', data: [before.before_exam_125_Hz, before.before_exam_250_Hz, before.before_exam_500_Hz, before.before_exam_1000_Hz, before.before_exam_2000_Hz, before.before_exam_4000_Hz, before.before_exam_8000_Hz], borderColor: '#3b82f6', tension: 0.3, fill: true, backgroundColor: 'rgba(59, 130, 246, 0.1)' },
                        { label: 'Prédit (Gain)', data: [after.after_exam_125_Hz, after.after_exam_250_Hz, after.after_exam_500_Hz, after.after_exam_1000_Hz, after.after_exam_2000_Hz, after.after_exam_4000_Hz, after.after_exam_8000_Hz], borderColor: '#000', tension: 0.3, borderDash: [5,5] }
                    ]
                },
                options: { scales: { y: { reverse: true, min: -10, max: 120 } } }
            });
        }

        // --- ANALYSE VOCALE ---
        document.getElementById('vocal-form').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                oreille: document.getElementById('oreille-vocal').value,
                srt_db: parseFloat(document.getElementById('srt_db').value),
                score_40db: parseFloat(document.getElementById('s40').value) || 0,
                score_60db: parseFloat(document.getElementById('s60').value) || 0,
                score_80db: parseFloat(document.getElementById('s80').value) || 0
            };

            try {
                const res = await fetch(API + "/predict_vocal", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                
                let data = await res.json();
                console.log("Données reçues de l'API :", data);

                // Extraction robuste du gain
                let gainValue = 0;
                if (Array.isArray(data) && data.length > 0) {
                    const row = data[0];
                    gainValue = row.true_gain_db ?? row.prediction ?? row[Object.keys(row)[0]] ?? 0;
                } else {
                    gainValue = data.true_gain_db ?? data.prediction ?? 0;
                }

                renderVocalChart(payload, gainValue);
            } catch(e) { 
                alert("Erreur lors de la prédiction vocale."); 
                console.error(e);
            }
        };

        function renderVocalChart(input, gain) {
            document.getElementById('chart-placeholder').classList.add('hidden');
            document.getElementById('chart-container').classList.remove('hidden');
            if(mainChart) mainChart.destroy();

            const ctx = document.getElementById('mainChart').getContext('2d');
            mainChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [0, 20, 40, 60, 80, 100],
                    datasets: [{
                        label: 'Compréhension Initiale (%)',
                        data: [null, null, input.score_40db, input.score_60db, input.score_80db, null],
                        borderColor: '#a855f7',
                        backgroundColor: 'rgba(168, 85, 247, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    scales: {
                        x: { title: { display: true, text: 'Intensité (dB)' } },
                        y: { min: 0, max: 100, title: { display: true, text: 'Score (%)' } }
                    }
                }
            });

            // Mise à jour du badge de résultat
            const badge = document.getElementById('result-badge');
            badge.classList.remove('hidden');
            badge.className = "mt-6 p-6 rounded-2xl border-2 bg-purple-50 border-purple-200 text-purple-700 font-bold text-center block";
            badge.innerHTML = `
                <div class="text-sm uppercase tracking-widest opacity-70">Gain Prothétique Prédit</div>
                <div class="text-4xl font-black mt-1">${Number(gain).toFixed(1)} <span class="text-xl font-medium">dB</span></div>
            `;
        }

        // --- ENTRAÎNEMENT ---
        document.getElementById('train-btn').onclick = async () => {
            if(!confirm("Lancer le ré-entraînement du modèle ?")) return;
            const btn = document.getElementById('train-btn');
            btn.innerText = "ENTRAINEMENT...";
            try {
                const res = await fetch(API + "/train", { method: 'POST' });
                const data = await res.json();
                alert(data.message);
            } catch(e) { alert("Erreur entraînement."); }
            finally { btn.innerText = "RÉ-ENTRAÎNER"; }
        };

        checkStatus();
    </script>
</body>
</html>
